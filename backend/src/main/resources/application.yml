spring:
  datasource:
    url: jdbc:h2:file:./data/campuspulse;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: CampusPulseDemoSecretKeyCampusPulseDemoSecretKey2026
    expiration-days: 7

logging:
  level:
    root: INFO
